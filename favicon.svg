<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Barbershop Appointment Portal</title>
  <!-- Rounded Base Badge in Institutional Navy -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#1F3A5F"/>
  
  <!-- Barber / Scissors Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Scissor Blades -->
    <line x1="20" y1="18" x2="44" y2="42"/>
    <line x1="44" y1="18" x2="20" y2="42"/>
    <!-- Scissor Finger Loops -->
    <circle cx="18" cy="45" r="5" fill="none"/>
    <circle cx="46" cy="45" r="5" fill="none"/>
  </g>
  <!-- Accent Center Pivot -->
  <circle cx="32" cy="30" r="2.5" fill="#C8553D"/>
</svg>
