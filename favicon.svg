<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Rounded Base Badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#primaryGrad)"/>
  
  <!-- Modern Campus / Event Pavilion Icon -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Pediment / Roof Triangle -->
    <path d="M32 14 L16 23 L48 23 Z"/>
    
    <!-- Architrave Beam -->
    <rect x="18" y="24" width="28" height="3" rx="1.5"/>
    
    <!-- Classical Columns -->
    <rect x="20" y="29" width="4.5" height="15" rx="1.5"/>
    <rect x="27.5" y="29" width="4.5" height="15" rx="1.5"/>
    <rect x="35" y="29" width="4.5" height="15" rx="1.5"/>
    <rect x="42.5" y="29" width="4.5" height="15" rx="1.5"/>
    
    <!-- Base Platform -->
    <rect x="16" y="45" width="32" height="4" rx="2"/>
    <rect x="14" y="49" width="36" height="2.5" rx="1"/>
  </g>
  
  <!-- Subtle Celebration Sparkle -->
  <circle cx="48" cy="15" r="2.5" fill="#38bdf8"/>
  <circle cx="15" cy="18" r="1.5" fill="#93c5fd"/>
</svg>

